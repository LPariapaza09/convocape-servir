name: Actualizar ofertas SERVIR

on:
  schedule:
    - cron: '0 10 * * *' # Todos los días 05:00 AM hora Perú (UTC-5)
  workflow_dispatch:

jobs:
  update-offers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml pandas pydantic python-dotenv google-genai
      - name: Ejecutar pipeline SERVIR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
      - name: Copiar JSON a app/www y publicar cambios
        run: |
          cp ofertas_economia.json app/www/ofertas_economia.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ofertas_economia.json app/www/ofertas_economia.json experiencia_cache.json
          git diff --staged --quiet || git commit -m "chore: actualizar ofertas_economia.json"
          git push
